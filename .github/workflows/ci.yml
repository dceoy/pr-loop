---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  skill-structure:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Verify canonical skills and discovery links
        run: |
          exit_status=0
          skill_count=0

          if [ ! -L .claude/skills ] || [ "$(readlink .claude/skills)" != "../skills" ]; then
            echo "::error::.claude/skills must link to ../skills"
            exit_status=1
          fi

          for skill_file in skills/*/SKILL.md; do
            [ -f "${skill_file}" ] || continue
            skill_count=$((skill_count + 1))
            name="${skill_file#skills/}"
            name="${name%/SKILL.md}"

            if ! grep -qx "name: ${name}" "${skill_file}"; then
              echo "::error::${skill_file} does not declare 'name: ${name}'"
              exit_status=1
            fi

            agents_link=".agents/skills/${name}"
            if [ ! -L "${agents_link}" ] || [ "$(readlink "${agents_link}")" != "../../skills/${name}" ]; then
              echo "::error::${agents_link} must link to ../../skills/${name}"
              exit_status=1
            fi

            if [ -L .claude/skills ] && [ ! -f ".claude/skills/${name}/SKILL.md" ]; then
              echo "::error::.claude/skills does not expose ${name}"
              exit_status=1
            fi
          done

          if [ "${skill_count}" -eq 0 ]; then
            echo "::error::no canonical skills found under skills/*/SKILL.md"
            exit_status=1
          fi

          exit "${exit_status}"
  github-actions-lint-and-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@main  # zizmor: ignore[unpinned-uses]
  markdown-lint:
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@main  # zizmor: ignore[unpinned-uses]
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs:
      - skill-structure
      - github-actions-lint-and-scan
      - markdown-lint
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      unconditional: true
