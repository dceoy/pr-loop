---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  skill-structure:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Verify canonical skills and discovery links
        run: |
          exit_status=0
          skill_count=0

          if [ ! -L .claude/skills ] || [ "$(readlink .claude/skills)" != "../skills" ]; then
            echo "::error::.claude/skills must link to ../skills"
            exit_status=1
          fi

          for skill_file in skills/*/SKILL.md; do
            [ -f "${skill_file}" ] || continue
            skill_count=$((skill_count + 1))
            name="${skill_file#skills/}"
            name="${name%/SKILL.md}"

            if ! grep -qx "name: ${name}" "${skill_file}"; then
              echo "::error::${skill_file} does not declare 'name: ${name}'"
              exit_status=1
            fi

            agents_link=".agents/skills/${name}"
            if [ ! -L "${agents_link}" ] || [ "$(readlink "${agents_link}")" != "../../skills/${name}" ]; then
              echo "::error::${agents_link} must link to ../../skills/${name}"
              exit_status=1
            fi

            if [ -L .claude/skills ] && [ ! -f ".claude/skills/${name}/SKILL.md" ]; then
              echo "::error::.claude/skills does not expose ${name}"
              exit_status=1
            fi
          done

          if [ "${skill_count}" -eq 0 ]; then
            echo "::error::no canonical skills found under skills/*/SKILL.md"
            exit_status=1
          fi

          exit "${exit_status}"
  github-actions-lint-and-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@main  # zizmor: ignore[unpinned-uses]
  markdown-lint:
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@main  # zizmor: ignore[unpinned-uses]
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs:
      - skill-structure
      - github-actions-lint-and-scan
      - markdown-lint
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      unconditional: true
  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - skill-structure
      - github-actions-lint-and-scan
      - markdown-lint
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Resolve version and create its immutable tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -er '.version | select(type == "string")' package.json)"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version must be a stable semantic version"
            exit 1
          fi

          tag="v${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ref_api="repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"
          if tag_sha="$(gh api "${ref_api}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::${tag} already points to another commit"
              exit 1
            fi
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST \
              -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}" >/dev/null
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"
  github-release:
    if: needs.prepare-release.outputs.publish == 'true'
    needs:
      - prepare-release
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-release.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      tag-name: ${{ needs.prepare-release.outputs.tag }}
      create-new-tag: false
  package-release:
    if: needs.prepare-release.outputs.publish == 'true'
    needs:
      - prepare-release
      - github-release
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/agent-skills-package.yml@main  # zizmor: ignore[unpinned-uses]
  attach-release-assets:
    if: needs.prepare-release.outputs.publish == 'true'
    needs:
      - prepare-release
      - package-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8  # zizmor: ignore[unpinned-uses]
        with:
          name: agent-skills
          path: ${{ runner.temp }}/agent-skills-release-assets
      - name: Upload skills to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=("${RUNNER_TEMP}/agent-skills-release-assets/"*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::no skill ZIP archives to upload"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
