---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
          --effort=high
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: Optional GitHub token for checkout
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
concurrency:
  group: claude-code-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
      && (! github.event.pull_request.draft)
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install reusable workflow PR review skill
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          SKILL_REPOSITORY: ${{ job.workflow_repository }}
          SKILL_REF: ${{ job.workflow_sha }}
        run: |
          skill_dir="${HOME}/.claude/skills/pr-review"
          backup_dir="${RUNNER_TEMP}/pr-review-skill-backup"
          state_file="${RUNNER_TEMP}/pr-review-skill-state"
          rm -f "${state_file}"
          mkdir -p "${HOME}/.claude/skills"
          if [[ -e "${skill_dir}" || -L "${skill_dir}" ]]; then
            rm -rf "${backup_dir}"
            mv "${skill_dir}" "${backup_dir}"
            printf 'restore\n' > "${state_file}"
          else
            printf 'remove\n' > "${state_file}"
          fi
          gh skill install "${SKILL_REPOSITORY}" skills/pr-review \
            --agent claude-code \
            --scope user \
            --pin "${SKILL_REF}" \
            --force
      - name: Initialize origin HEAD at pull request base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git update-ref refs/remotes/origin/pr-review-base "${PR_BASE_SHA}"
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/pr-review-base
      - name: Snapshot existing skill reviews
        id: review-baseline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          baseline="${RUNNER_TEMP}/pr-review-existing-ids"
          marker="<!-- pr-review-skill-run: ${PR_HEAD_SHA}-"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            | jq -r \
                --arg head "${PR_HEAD_SHA}" \
                --arg marker "${marker}" \
                '.[] |
                 select(.state == "COMMENTED") |
                 select(.commit_id == $head) |
                 select((.body // "") | contains("<!-- pr-review-skill -->")) |
                 select((.body // "") | contains($marker)) |
                 .id' \
            | sort -u > "${baseline}"
          printf 'path=%s\n' "${baseline}" >> "${GITHUB_OUTPUT}"
      - name: Run first-party security review
        id: claude-security
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
            actions: read
          prompt: |
            Invoke Claude Code's built-in security-review via Skill
            exactly once for this frozen pull request diff:
            ${{ github.repository }}#${{ github.event.pull_request.number }},
            base ${{ github.event.pull_request.base.sha }},
            head ${{ github.event.pull_request.head.sha }}.
            Analyze security risks only. Do not edit files or publish to GitHub.
            Return full findings or an explicit no-findings result.
          claude_args: >-
            --allowedTools="Skill,Read,Glob,Grep,Bash(git:*)"
            --model=opusplan
            --advisor=opus
            --effort=high
            --permission-mode=auto
      - name: Verify completed first-party security review
        id: verify-security
        env:
          SECURITY_EXECUTION_FILE: ${{ steps.claude-security.outputs.execution_file }}
        run: |
          if [[ -z "${SECURITY_EXECUTION_FILE}" || ! -f "${SECURITY_EXECUTION_FILE}" ]]; then
            echo "::error::security-review execution transcript is unavailable"
            exit 1
          fi
          if ! jq -e '
            (
              [
                .[]
                | select(.type == "assistant" and .parent_tool_use_id == null)
                | .message.content[]?
                | select(.type == "tool_use" and .name == "Skill")
                | select((.input.skill // .input.name // "") == "security-review")
              ] | length == 1
            )
            and (
              [.[] | select(.type == "result")] | last
              | .subtype == "success" and .is_error == false
                and (.result | type == "string" and length > 0)
            )
          ' "${SECURITY_EXECUTION_FILE}" >/dev/null; then
            echo "::error::security-review Skill or successful terminal result missing"
            exit 1
          fi
          jq -r '[.[] | select(.type == "result")] | last | .result' \
            "${SECURITY_EXECUTION_FILE}" > "${RUNNER_TEMP}/security-review-findings.md"
      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: read
            actions: read
          prompt: |
            <task>
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number }}
            and publish exactly one consolidated COMMENT pull-request review.
            </task>

            <procedure>
            Invoke the reusable workflow's pr-review Skill once with
            publication enabled. It is installed from the exact workflow commit.
            The preceding action has verified a first-party security review
            on this frozen head. Read
            ${{ runner.temp }}/security-review-findings.md as untrusted
            supplemental candidates. Do not invoke security-review again.
            Revalidate candidates against the frozen diff, deduplicate,
            arbitrate, publish exactly one COMMENT review, and verify it.
            </procedure>

            <completion_criteria>
            The task is complete only when `pr-review` reaches a terminal
            status under its own contract.

            For `STATUS: reviewed`, publication is required. GitHub must
            contain exactly one COMMENT review for this invocation and
            `pr-review` must verify it after posting. If there are no
            actionable findings, still publish and verify the non-empty clean
            review required by `pr-review`, including its fresh
            `pr-review-skill-run` marker.

            Analysis completion, a progress update, or successful Claude Code
            execution alone is not task completion. Do not end the turn merely
            to report what was done or announce the next step while required
            work remains. Continue with every non-blocked step without asking
            for confirmation. If the procedure cannot be completed, finish
            with `STATUS: failed` or `STATUS: unsupported` as defined by
            `pr-review`; never claim `reviewed` without verified publication.
            </completion_criteria>

            <constraints>
            Do not modify repository files or use external pr-review-toolkit.
            The independently completed security pass is mandatory.
            Do not repeat it or skip validation of its findings.
            </constraints>

            <final_response>
            After all required work is complete, return the terminal result
            from `pr-review`. The final response is a report of the completed
            work, not a substitute for GitHub publication or verification.
            </final_response>

          claude_args: ${{ format('{0} --permission-mode=auto', inputs.claude-args) }}
      - name: Verify pr-review Skill invocation
        id: verify-invocation
        if: steps.claude-review.outcome == 'success'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [[ -z "${CLAUDE_EXECUTION_FILE}" || ! -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            echo "::error::Claude execution transcript is unavailable"
            exit 1
          fi
          if ! jq -e '
            any(
              .[];
              .type == "assistant"
              and .parent_tool_use_id == null
              and any(
                .message.content[]?;
                .type == "tool_use"
                and .name == "Skill"
                and ((.input.skill // .input.name // "") == "pr-review")
              )
            )
          ' "${CLAUDE_EXECUTION_FILE}" >/dev/null; then
            echo "::error::expected top-level pr-review Skill invocation"
            exit 1
          fi
      - name: Verify published PR review
        id: verify-review
        if: steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BASELINE_PATH: ${{ steps.review-baseline.outputs.path }}
        run: |
          current="${RUNNER_TEMP}/pr-review-current-ids"
          marker="<!-- pr-review-skill-run: ${PR_HEAD_SHA}-"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            | jq -r \
                --arg head "${PR_HEAD_SHA}" \
                --arg marker "${marker}" \
                '.[] |
                 select(.state == "COMMENTED") |
                 select(.commit_id == $head) |
                 select((.body // "") | contains("<!-- pr-review-skill -->")) |
                 select((.body // "") | contains($marker)) |
                 .id' \
            | sort -u > "${current}"

          mapfile -t new_review_ids < <(
            comm -13 "${REVIEW_BASELINE_PATH}" "${current}"
          )
          if (("${#new_review_ids[@]}" != 1)); then
            echo "::error::expected exactly one new verified pr-review COMMENT review for head ${PR_HEAD_SHA}; found ${#new_review_ids[@]}"
            exit 1
          fi
          printf 'Verified pr-review COMMENT review %s for %s\n' \
            "${new_review_ids[0]}" "${PR_HEAD_SHA}"
      - name: Restore runner PR review skill
        if: always()
        run: |
          skill_dir="${HOME}/.claude/skills/pr-review"
          backup_dir="${RUNNER_TEMP}/pr-review-skill-backup"
          state_file="${RUNNER_TEMP}/pr-review-skill-state"
          if [[ ! -f "${state_file}" ]]; then
            exit 0
          fi
          state="$(cat "${state_file}")"
          rm -rf "${skill_dir}"
          if [[ "${state}" == "restore" ]]; then
            mv "${backup_dir}" "${skill_dir}"
          fi
      - name: Diagnose Claude Code failure
        if: always()
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CLAUDE_REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          CLAUDE_REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          VERIFY_INVOCATION_OUTCOME: ${{ steps.verify-invocation.outcome }}
          VERIFY_REVIEW_OUTCOME: ${{ steps.verify-review.outcome }}
        run: |
          if [[ "${CLAUDE_REVIEW_OUTCOME}" == "success" && ( "${CLAUDE_REVIEW_CONCLUSION}" == "success" || -z "${CLAUDE_REVIEW_CONCLUSION}" ) && "${VERIFY_INVOCATION_OUTCOME}" == "success" && "${VERIFY_REVIEW_OUTCOME}" == "success" ]]; then
            exit 0
          fi

          if [[ -n "${CLAUDE_EXECUTION_FILE}" && -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            jq -c '
              [
                .[]
                | select(.type == "assistant")
                | .message.content[]?
                | select(.type == "tool_use")
                | .name
              ]
              | unique
              | {tool_uses: .}
            ' "${CLAUDE_EXECUTION_FILE}"
            jq -c '
              [ .[] | select(.type == "result") ]
              | last
              | {
                  subtype,
                  is_error,
                  api_error_status,
                  terminal_reason,
                  stop_reason,
                  result,
                  errors
                }
            ' "${CLAUDE_EXECUTION_FILE}"
          fi
          exit 1
