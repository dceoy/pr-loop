---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
          --effort=high
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: Optional GitHub token for checkout
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
concurrency:
  group: claude-code-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
      && (! github.event.pull_request.draft)
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install reusable workflow PR review skill
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          SKILL_REPOSITORY: ${{ job.workflow_repository }}
          SKILL_REF: ${{ job.workflow_sha }}
        run: |
          skill_dir="${HOME}/.claude/skills/pr-review"
          backup_dir="${RUNNER_TEMP}/pr-review-skill-backup"
          state_file="${RUNNER_TEMP}/pr-review-skill-state"
          rm -f "${state_file}"
          mkdir -p "${HOME}/.claude/skills"
          if [[ -e "${skill_dir}" || -L "${skill_dir}" ]]; then
            rm -rf "${backup_dir}"
            mv "${skill_dir}" "${backup_dir}"
            printf 'restore\n' > "${state_file}"
          else
            printf 'remove\n' > "${state_file}"
          fi
          gh skill install "${SKILL_REPOSITORY}" skills/pr-review \
            --agent claude-code \
            --scope user \
            --pin "${SKILL_REF}" \
            --force
      - name: Initialize origin HEAD at pull request base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git update-ref refs/remotes/origin/pr-review-base "${PR_BASE_SHA}"
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/pr-review-base
      - name: Snapshot existing skill reviews
        id: review-baseline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          baseline="${RUNNER_TEMP}/pr-review-existing-ids"
          marker="<!-- pr-review-skill-run: ${PR_HEAD_SHA}-"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            | jq -r \
                --arg head "${PR_HEAD_SHA}" \
                --arg marker "${marker}" \
                '.[] |
                 select(.state == "COMMENTED") |
                 select(.commit_id == $head) |
                 select((.body // "") | contains("<!-- pr-review-skill -->")) |
                 select((.body // "") | contains($marker)) |
                 .id' \
            | sort -u > "${baseline}"
          printf 'path=%s\n' "${baseline}" >> "${GITHUB_OUTPUT}"
      - name: Guard premature Claude completion
        run: |
          cat > "${RUNNER_TEMP}/review-stop-hook.py" <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          try:
              event = json.load(sys.stdin)
              if event.get("stop_hook_active"):
                  sys.exit(0)
              head = os.environ["PR_HEAD_SHA"]
              repo = os.environ["GITHUB_REPOSITORY"]
              number = os.environ["PR_NUMBER"]
              baseline = set(Path(os.environ["REVIEW_BASELINE_PATH"]).read_text().split())
              query = (
                  '.[] | select(.state == "COMMENTED" and .commit_id == '
                  + json.dumps(head)
                  + ' and ((.body // "") | contains("<!-- pr-review-skill -->"))'
                  + ' and ((.body // "") | contains('
                  + json.dumps("<!-- pr-review-skill-run: " + head + "-")
                  + '))) | .id'
              )
              proc = subprocess.run(
                  ["gh", "api", "--paginate",
                   f"repos/{repo}/pulls/{number}/reviews?per_page=100",
                   "--jq", query],
                  capture_output=True, text=True, check=True,
              )
              new_ids = set(proc.stdout.split()) - baseline
              if len(new_ids) == 1:
                  sys.exit(0)
              counter = Path(os.environ["RUNNER_TEMP"]) / "review-stop-attempts"
              tries = int(counter.read_text()) if counter.exists() else 0
              if tries < 2:
                  counter.write_text(str(tries + 1))
                  print(json.dumps({
                      "decision": "block",
                      "reason": "The required new COMMENT review has not been "
                                "verified for the frozen head. Resume pr-review "
                                "and publish/verify it, or report a terminal "
                                "failure rather than waiting for a subagent.",
                  }))
          except (OSError, ValueError, subprocess.CalledProcessError) as exc:
              print(f"Review stop check unavailable: {exc}", file=sys.stderr)
              # Final GitHub verification remains authoritative.
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          settings = {"hooks": {"Stop": [{"hooks": [{
              "type": "command",
              "command": "python3 " + str(root / "review-stop-hook.py"),
          }]}]}}
          (root / "review-settings.json").write_text(json.dumps(settings))
          PY
      - name: Run comprehensive PR review
        id: claude-review
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BASELINE_PATH: ${{ steps.review-baseline.outputs.path }}
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: read
            actions: read
          prompt: |
            Invoke the pinned pr-review Skill exactly once with publication enabled.
            Review ${{ github.repository }} PR #${{ github.event.pull_request.number }}
            at base ${{ github.event.pull_request.base.sha }} and
            frozen head ${{ github.event.pull_request.head.sha }}.

            Let pr-review discover one suitable installed security-review Skill,
            whether built-in or third-party. Run it only if available and safe,
            using a bounded, read-only foreground delegate where supported.
            If no eligible Skill or safe invocation path exists, continue the
            regular pr-review without a separate security pass. Never install
            a new Skill or delegate GitHub publication. When an invoked Skill
            fails or cannot return control, follow pr-review's fail-closed rule.
            Resume the parent pr-review after the delegate completes.

            Validate and deduplicate findings, then publish and verify exactly
            one COMMENT review for this invocation, including a nonempty clean
            review when no actionable defects exist and a fresh
            pr-review-skill-run marker. A successful model response is not proof
            of publication. Do not edit repository files. If review cannot be
            completed, report STATUS: failed or unsupported as appropriate.
            Do not finish with an unfinished subagent or publication task.
          claude_args: ${{ format('{0} --settings="{1}" --permission-mode=auto', inputs.claude-args, format('{0}/review-settings.json', runner.temp)) }}
      - name: Verify pr-review invocation and COMMENT publication
        id: verify-review
        if: steps.claude-review.outcome == 'success'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BASELINE_PATH: ${{ steps.review-baseline.outputs.path }}
        run: |
          if [[ -z "${CLAUDE_EXECUTION_FILE}" || ! -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            echo "::error::Claude execution transcript is unavailable"
            exit 1
          fi
          if ! jq -e '
            any(
              .[];
              .type == "assistant"
              and .parent_tool_use_id == null
              and any(
                .message.content[]?;
                .type == "tool_use"
                and .name == "Skill"
                and ((.input.skill // .input.name // "") == "pr-review")
              )
            )
          ' "${CLAUDE_EXECUTION_FILE}" >/dev/null; then
            echo "::error::expected top-level pr-review Skill invocation"
            exit 1
          fi
          current="${RUNNER_TEMP}/pr-review-current-ids"
          marker="<!-- pr-review-skill-run: ${PR_HEAD_SHA}-"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            | jq -r \
                --arg head "${PR_HEAD_SHA}" \
                --arg marker "${marker}" \
                '.[] |
                 select(.state == "COMMENTED") |
                 select(.commit_id == $head) |
                 select((.body // "") | contains("<!-- pr-review-skill -->")) |
                 select((.body // "") | contains($marker)) |
                 .id' \
            | sort -u > "${current}"

          mapfile -t new_review_ids < <(
            comm -13 "${REVIEW_BASELINE_PATH}" "${current}"
          )
          if (("${#new_review_ids[@]}" != 1)); then
            echo "::error::expected exactly one new verified pr-review COMMENT review for head ${PR_HEAD_SHA}; found ${#new_review_ids[@]}"
            exit 1
          fi
          printf 'Verified pr-review COMMENT review %s for %s\n' \
            "${new_review_ids[0]}" "${PR_HEAD_SHA}"
      - name: Restore runner PR review skill
        if: always()
        run: |
          skill_dir="${HOME}/.claude/skills/pr-review"
          backup_dir="${RUNNER_TEMP}/pr-review-skill-backup"
          state_file="${RUNNER_TEMP}/pr-review-skill-state"
          if [[ ! -f "${state_file}" ]]; then
            exit 0
          fi
          state="$(cat "${state_file}")"
          rm -rf "${skill_dir}"
          if [[ "${state}" == "restore" ]]; then
            mv "${backup_dir}" "${skill_dir}"
          fi
      - name: Diagnose Claude Code failure
        if: always()
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CLAUDE_REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          CLAUDE_REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          VERIFY_REVIEW_OUTCOME: ${{ steps.verify-review.outcome }}
        run: |
          if [[ "${CLAUDE_REVIEW_OUTCOME}" == "success" &&
                ( "${CLAUDE_REVIEW_CONCLUSION}" == "success" || -z "${CLAUDE_REVIEW_CONCLUSION}" ) &&
                "${VERIFY_REVIEW_OUTCOME}" == "success" ]]; then
            exit 0
          fi
          if [[ -n "${CLAUDE_EXECUTION_FILE}" && -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            jq -c '{
              tool_uses: ([.[] | select(.type == "assistant") | .message.content[]?
                | select(.type == "tool_use") | .name] | unique),
              terminal: ([.[] | select(.type == "result")] | last
                | {subtype, is_error, api_error_status, terminal_reason,
                   stop_reason, result, errors})
            }' "${CLAUDE_EXECUTION_FILE}"
          fi
          exit 1
