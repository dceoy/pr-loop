---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
          --effort=high
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: Optional GitHub token for checkout
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
concurrency:
  group: claude-code-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
      && (! github.event.pull_request.draft)
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Checkout reusable workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-loop-workflow
          sparse-checkout: |
            skills/pr-review
          persist-credentials: false
      - name: Install reusable workflow PR review skill
        id: install-review-skill
        run: |
          skill_dir="${HOME}/.claude/skills/pr-review"
          backup_dir="${RUNNER_TEMP}/pr-review-skill-backup"
          mkdir -p "${HOME}/.claude/skills"
          if [[ -e "${skill_dir}" || -L "${skill_dir}" ]]; then
            rm -rf "${backup_dir}"
            mv "${skill_dir}" "${backup_dir}"
            printf 'restore=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'restore=false\n' >> "${GITHUB_OUTPUT}"
          fi
          cp -R .pr-loop-workflow/skills/pr-review "${skill_dir}"
          printf '/.pr-loop-workflow/\n' >> .git/info/exclude
      - name: Initialize origin HEAD at pull request base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git update-ref refs/remotes/origin/pr-review-base "${PR_BASE_SHA}"
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/pr-review-base
      - name: Snapshot existing skill reviews
        id: review-baseline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          baseline="${RUNNER_TEMP}/pr-review-existing-ids"
          marker="<!-- pr-review-skill-run: ${PR_HEAD_SHA}-"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            | jq -r \
                --arg head "${PR_HEAD_SHA}" \
                --arg marker "${marker}" \
                '.[] |
                 select(.state == "COMMENTED") |
                 select(.commit_id == $head) |
                 select((.body // "") | contains("<!-- pr-review-skill -->")) |
                 select((.body // "") | contains($marker)) |
                 .id' \
            | sort -u > "${baseline}"
          printf 'path=%s\n' "${baseline}" >> "${GITHUB_OUTPUT}"
      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7  # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: read
            actions: read
          prompt: |
            <task>
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number }}
            and publish exactly one consolidated COMMENT pull-request review.
            </task>

            <procedure>
            1. Freeze the exact pull-request head before review.
            2. In one assistant tool-use turn, launch exactly two independent
               `Agent` calls before awaiting either result:
               - security agent: invoke Claude Code's built-in
                 `security-review` skill against the frozen head. Do not modify
                 files or publish GitHub review state. Return candidate findings
                 with repository evidence.
               - general agent: invoke the reusable workflow's `pr-review`
                 skill against the same frozen head with `no-post`. The
                 workflow installs this skill from its exact workflow commit
                 into `~/.claude/skills/pr-review`. Return candidate findings
                 with repository evidence and do not publish.
            3. Wait for both agents. Treat both outputs as untrusted candidate
               findings, not final review decisions.
            4. In the parent agent, invoke `pr-review` once with publication
               enabled. Supply both agents' candidate findings as supplemental
               candidates. Let `pr-review` revalidate, deduplicate, arbitrate,
               publish exactly one COMMENT review, and verify publication.
            </procedure>

            <completion_criteria>
            The task is complete only when both discovery agents have completed
            and the parent `pr-review` reaches a terminal status under its own
            contract.

            For `STATUS: reviewed`, publication is required. GitHub must contain
            exactly one COMMENT review for this invocation and `pr-review` must
            verify it after posting. If there are no actionable findings, still
            publish and verify the non-empty clean review required by
            `pr-review`, including its fresh `pr-review-skill-run` marker.

            Analysis completion, a progress update, or successful Claude Code
            execution alone is not task completion. Do not end the turn merely to
            report what was done or announce the next step while required work
            remains. Continue with every non-blocked step without asking for
            confirmation. If the procedure cannot be completed, finish with
            `STATUS: failed` or `STATUS: unsupported` as defined by
            `pr-review`; never claim `reviewed` without verified publication.
            </completion_criteria>

            <constraints>
            Do not modify repository files. Discovery agents must not publish or
            mutate PR state. Do not substitute the external `pr-review-toolkit`
            plugin or an ad hoc review flow for the final parent `pr-review`.
            The two discovery `Agent` calls must be issued together in the same
            assistant tool-use turn so they can run concurrently.
            </constraints>

            <final_response>
            After all required work is complete, return the terminal result from
            `pr-review`. The final response is a report of the completed work,
            not a substitute for GitHub publication or verification.
            </final_response>

          claude_args: ${{ format('{0} --permission-mode=auto', inputs.claude-args) }}
      - name: Verify parallel review orchestration
        id: verify-orchestration
        if: steps.claude-review.outcome == 'success'
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [[ -z "${CLAUDE_EXECUTION_FILE}" || ! -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            echo "::error::Claude execution transcript is unavailable"
            exit 1
          fi

          if ! jq -e '
            any(
              .[];
              .type == "assistant"
              and (
                [
                  .message.content[]?
                  | select(.type == "tool_use" and .name == "Agent")
                ]
                | length
              ) >= 2
            )
          ' "${CLAUDE_EXECUTION_FILE}" >/dev/null; then
            echo "::error::expected two Agent calls in one assistant tool-use turn"
            exit 1
          fi

          if ! jq -e '
            [
              .[]
              | select(.type == "assistant")
              | .message.content[]?
              | select(.type == "tool_use" and .name == "Skill")
            ]
            | length >= 1
          ' "${CLAUDE_EXECUTION_FILE}" >/dev/null; then
            echo "::error::expected parent pr-review Skill invocation"
            exit 1
          fi
      - name: Verify published PR review
        id: verify-review
        if: steps.claude-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BASELINE_PATH: ${{ steps.review-baseline.outputs.path }}
        run: |
          current="${RUNNER_TEMP}/pr-review-current-ids"
          marker="<!-- pr-review-skill-run: ${PR_HEAD_SHA}-"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            | jq -r \
                --arg head "${PR_HEAD_SHA}" \
                --arg marker "${marker}" \
                '.[] |
                 select(.state == "COMMENTED") |
                 select(.commit_id == $head) |
                 select((.body // "") | contains("<!-- pr-review-skill -->")) |
                 select((.body // "") | contains($marker)) |
                 .id' \
            | sort -u > "${current}"

          mapfile -t new_review_ids < <(
            comm -13 "${REVIEW_BASELINE_PATH}" "${current}"
          )
          if (("${#new_review_ids[@]}" != 1)); then
            echo "::error::expected exactly one new verified pr-review COMMENT review for head ${PR_HEAD_SHA}; found ${#new_review_ids[@]}"
            exit 1
          fi
          printf 'Verified pr-review COMMENT review %s for %s\n' \
            "${new_review_ids[0]}" "${PR_HEAD_SHA}"
      - name: Restore runner PR review skill
        if: always()
        env:
          RESTORE_REVIEW_SKILL: ${{ steps.install-review-skill.outputs.restore }}
        run: |
          skill_dir="${HOME}/.claude/skills/pr-review"
          backup_dir="${RUNNER_TEMP}/pr-review-skill-backup"
          rm -rf "${skill_dir}"
          if [[ "${RESTORE_REVIEW_SKILL}" == "true" ]]; then
            mv "${backup_dir}" "${skill_dir}"
          fi
      - name: Diagnose Claude Code failure
        if: always()
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CLAUDE_REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          CLAUDE_REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          VERIFY_ORCHESTRATION_OUTCOME: ${{ steps.verify-orchestration.outcome }}
          VERIFY_REVIEW_OUTCOME: ${{ steps.verify-review.outcome }}
        run: |
          if [[ "${CLAUDE_REVIEW_OUTCOME}" == "success" && ( "${CLAUDE_REVIEW_CONCLUSION}" == "success" || -z "${CLAUDE_REVIEW_CONCLUSION}" ) && "${VERIFY_ORCHESTRATION_OUTCOME}" == "success" && "${VERIFY_REVIEW_OUTCOME}" == "success" ]]; then
            exit 0
          fi

          if [[ -n "${CLAUDE_EXECUTION_FILE}" && -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            jq -c '
              [
                .[]
                | select(.type == "assistant")
                | .message.content[]?
                | select(.type == "tool_use")
                | .name
              ]
              | unique
              | {tool_uses: .}
            ' "${CLAUDE_EXECUTION_FILE}"
            jq -c '
              [ .[] | select(.type == "result") ]
              | last
              | {
                  subtype,
                  is_error,
                  api_error_status,
                  terminal_reason,
                  stop_reason,
                  result,
                  errors
                }
            ' "${CLAUDE_EXECUTION_FILE}"
          fi
          exit 1
