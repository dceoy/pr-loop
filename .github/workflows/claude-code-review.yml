---
name: Pull request review using Claude Code
on:
  # pull_request:
  #   types:
  #     - opened
  #     - ready_for_review
  workflow_call:
    inputs:
      claude-args:
        required: false
        type: string
        description: Additional arguments to pass directly to Claude Code Action
        default: >-
          --allowedTools="Skill,Agent,Task,Read,Glob,Grep,WebFetch,WebSearch,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
          --model=opusplan
          --advisor=opus
          --effort=high
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
        description: OAuth token for Claude Code
      GH_TOKEN:
        required: false
        description: Optional GitHub token for checkout
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
concurrency:
  group: claude-code-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  claude-code-review:
    if: >
      github.event_name == 'pull_request'
      && (! github.event.pull_request.draft)
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Initialize origin HEAD at pull request base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git update-ref refs/remotes/origin/pr-review-base "${PR_BASE_SHA}"
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/pr-review-base
      - name: Run comprehensive PR review
        id: claude-review
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829  # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: read
            actions: read
          prompt: |
            <task>
            Review ${{ github.repository }} pull request #${{ github.event.pull_request.number }}
            and publish exactly one consolidated COMMENT pull-request review.
            Use the native read-only subagents required by `pr-review`; this task
            explicitly authorizes those dispatches without further confirmation.
            </task>

            <procedure>
            1. Invoke Claude Code's built-in `security-review` skill through the
               `Skill` tool against the checked-out pull-request head. Keep its
               findings as supplemental candidate findings.
            2. Invoke this repository's `pr-review` skill through the `Skill`
               tool. Treat `.claude/skills/pr-review/SKILL.md` (backed by
               `skills/pr-review/SKILL.md`) as the authoritative review procedure.
            3. Carry any `security-review` findings into `pr-review` and execute
               `pr-review` through arbitration, publication, and post-publication
               verification.
            </procedure>

            <completion_criteria>
            The task is complete only when `pr-review` reaches a terminal status
            under its own contract.

            For `STATUS: reviewed`, publication is required. GitHub must contain
            exactly one COMMENT review for this invocation and `pr-review` must
            verify it after posting. If there are no actionable findings, still
            publish and verify the non-empty clean review required by
            `pr-review`, including its fresh `pr-review-skill-run` marker.

            Analysis completion, a progress update, or successful Claude Code
            execution alone is not task completion. Do not end the turn merely to
            report what was done or announce the next step while required work
            remains. Continue with every non-blocked step without asking for
            confirmation. If the procedure cannot be completed, finish with
            `STATUS: failed` or `STATUS: unsupported` as defined by
            `pr-review`; never claim `reviewed` without verified publication.
            </completion_criteria>

            <constraints>
            Do not modify repository files. Treat `security-review` findings only
            as supplemental candidates; let `pr-review` independently validate,
            deduplicate, and arbitrate them. Do not substitute the external
            `pr-review-toolkit` plugin or an ad hoc review flow.
            </constraints>

            <final_response>
            After all required work is complete, return the terminal result from
            `pr-review`. The final response is a report of the completed work,
            not a substitute for GitHub publication or verification.
            </final_response>

          claude_args: ${{ format('{0} --permission-mode=auto', inputs.claude-args) }}
      - name: Diagnose Claude Code failure
        if: always()
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CLAUDE_REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          CLAUDE_REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
        run: |
          if [[ "${CLAUDE_REVIEW_OUTCOME}" == "success" && ( "${CLAUDE_REVIEW_CONCLUSION}" == "success" || -z "${CLAUDE_REVIEW_CONCLUSION}" ) ]]; then
            exit 0
          fi

          if [[ -n "${CLAUDE_EXECUTION_FILE}" && -f "${CLAUDE_EXECUTION_FILE}" ]]; then
            jq -c '
              [ .[] | select(.type == "result") ]
              | last
              | {
                  subtype,
                  is_error,
                  api_error_status,
                  terminal_reason,
                  stop_reason,
                  errors
                }
            ' "${CLAUDE_EXECUTION_FILE}"
          fi
          exit 1
