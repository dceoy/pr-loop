---
name: Repository maintenance
on:
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST
  workflow_call:
    inputs:
      task:
        description: Release version increment
        type: string
        required: false
        default: patch-release
permissions:
  contents: read
concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'dceoy/pr-loop'
    permissions:
      contents: write
    # Update this SHA to the upstream merge commit before merging this PR.
    uses: dceoy/gha-for-devops/.github/workflows/github-release.yml@2a17c530551ee52af5a0507b1e426357195dead5
    with:
      version-bump: ${{ inputs.task || 'auto' }}
      release-trigger-paths: |
        skills
        .github/workflows/claude-code-review.yml
  package-release:
    needs: release
    if: needs.release.outputs.release-tag
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/agent-skills-package.yml@main  # zizmor: ignore[unpinned-uses]
    with:
      release-tag: ${{ needs.release.outputs.release-tag }}
