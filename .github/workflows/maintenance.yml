---
name: Repository maintenance
on:
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST
  workflow_call:
    inputs:
      task:
        description: Release version increment
        type: string
        required: false
        default: patch-release
permissions:
  contents: read
concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'dceoy/pr-loop'
    permissions:
      contents: write
      actions: read
      security-events: write
    # Switch to @main after the upstream reusable-workflow PR is merged.
    uses: dceoy/gha-for-devops/.github/workflows/github-semver-release.yml@feat/reusable-semver-release  # zizmor: ignore[unpinned-uses]
    with:
      bump: ${{ github.event_name == 'schedule' && 'auto' || inputs.task }}
      release-paths: |
        skills
        .github/workflows/claude-code-review.yml
      package-agent-skills: true
