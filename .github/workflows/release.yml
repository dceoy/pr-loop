---
name: Publish GitHub Release
on:
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:Only the release increment is selectable
    inputs:
      task:
        description: Release version increment
        type: choice
        required: true
        default: patch-release
        options:
          - major-release
          - minor-release
          - patch-release
permissions:
  contents: read
concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'dceoy/pr-loop'
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-release.yml@664463f91334a5030111bfab0a999be23230edca
    with:
      version-bump: ${{ inputs.task || 'auto' }}
      release-trigger-paths: |
        skills
        .github/workflows/claude-code-review.yml
  package-release:
    needs: release
    if: needs.release.outputs.release-tag
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/agent-skills-package.yml@664463f91334a5030111bfab0a999be23230edca
    with:
      release-tag: ${{ needs.release.outputs.release-tag }}
