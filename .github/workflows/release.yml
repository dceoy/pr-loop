---
name: Publish GitHub Release
on:
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:Only the release increment is selectable
    inputs:
      task:
        description: Release version increment
        type: choice
        required: true
        default: patch-release
        options:
          - major-release
          - minor-release
          - patch-release
permissions:
  contents: read
jobs:
  maintenance:
    permissions:
      contents: write
      actions: read
      security-events: write
    uses: $/.github/workflows/maintenance.yml
    with:
      task: ${{ inputs.task }}
