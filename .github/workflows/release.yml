---
name: Publish GitHub Release
on:
  schedule:
    - cron: '15 0 * * 1'  # Mondays 09:15 JST
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:Only the release increment is selectable
    inputs:
      task:
        description: Release version increment
        type: choice
        required: true
        default: patch-release
        options:
          - major-release
          - minor-release
          - patch-release
permissions: {}
concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'dceoy/pr-loop'
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-release.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      version-bump: ${{ inputs.task || 'auto' }}
      release-trigger-paths: |
        skills
        .github/workflows/claude-code-review.yml
  package-release:
    needs: release
    if: needs.release.outputs.release-tag
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/agent-skills-package.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      release-tag: ${{ needs.release.outputs.release-tag }}
